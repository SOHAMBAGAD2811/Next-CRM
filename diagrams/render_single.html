<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; }
    h2 { font-size: 16px; color: #333; margin-bottom: 16px; text-align: center; }
    .mermaid { display: flex; justify-content: center; }
  </style>
</head>
<body>
  <h2 id="title"></h2>
  <pre class="mermaid" id="chart"></pre>

  <script>
    const diagrams = {
      1: {
        title: "Entity-Relationship Diagram",
        code: `erDiagram
    USER ||--o{ LEAD : "owns"
    LEAD ||--o{ INTERACTION : "has"
    LEAD ||--o{ LEAD_SCORE_HISTORY : "records"
    LEAD ||--o{ FILE_ATTACHMENT : "has"
    USER ||--o{ SEGMENT : "creates"
    USER ||--o{ CAMPAIGN : "creates"
    USER ||--o{ WORKFLOW : "creates"
    CAMPAIGN }o--|| SEGMENT : "targets"
    USER {
        int id PK
        string name
        string email UK
        string password_hash
        string role
    }
    LEAD {
        int id PK
        int user_id FK
        string name
        string email UK
        string company
        string phone
        enum stage
        decimal deal_value
        int ai_score
        enum sentiment
        boolean churn_risk
        int churn_risk_pct
        datetime last_contacted
        datetime created_at
    }
    INTERACTION {
        int id PK
        int lead_id FK
        enum channel
        text body
        enum sentiment
        datetime created_at
    }
    LEAD_SCORE_HISTORY {
        int id PK
        int lead_id FK
        int score
        datetime recorded_at
    }`
      },
      2: {
        title: "CRM Process Lifecycle",
        code: `flowchart TD
    A["Lead Captured\\n(Portal / Manual Entry)"] --> B["AI Score Computed\\n(Rule-based: 0-100)"]
    B --> C["Lead Stage: Lead"]
    C --> D{"Qualification\\nCriteria Met?"}
    D -- Yes --> E["Stage: Qualified"]
    D -- No --> F["Nurture via\\nCampaigns"]
    F --> D
    E --> G["Stage: Proposal"]
    G --> H{"Deal\\nClosed?"}
    H -- Yes --> I["Stage: Closed (Won)"]
    H -- No --> J["Churn Risk Assessment"]
    J --> K{"At Risk?"}
    K -- Yes --> L["Auto Re-engagement Email"]
    L --> G
    K -- No --> G
    I --> M["Post-Sale CSAT Feedback"]`
      },
      3: {
        title: "Data-Driven Decision Flow",
        code: `flowchart LR
    subgraph DC["Data Collection"]
        A["Lead Data"] --> D["MySQL Database"]
        B["Interactions"] --> D
        C["CSAT Feedback"] --> D
    end
    subgraph AP["AI Processing"]
        E["VADER Sentiment\\nAnalysis"]
        F["Lead Scoring\\nEngine"]
        G["Churn Risk\\nPredictor"]
    end
    subgraph AI["Actionable Insights"]
        H["Dashboard\\nSentiment Charts"]
        I["Prioritised\\nLead Rankings"]
        J["At-Risk\\nAlert List"]
    end
    D --> E
    D --> F
    D --> G
    E --> H
    F --> I
    G --> J`
      },
      4: {
        title: "System Architecture",
        code: `flowchart TB
    subgraph CL["Client Layer"]
        Browser["Web Browser"]
        Portal["Customer Portal"]
    end
    subgraph FL["Frontend Layer - Next.js 16"]
        AuthGuard["AuthGuard"]
        Dashboard["Dashboard"]
        Leads["Leads Page"]
        Pipeline["Pipeline Kanban"]
        Churn["Churn Risk"]
        Assistant["AI Assistant"]
        Campaigns["Campaigns"]
    end
    subgraph AL["API Layer - Flask 3.0"]
        AuthAPI["/api/auth/*"]
        LeadAPI["/api/leads/*"]
        DashAPI["/api/dashboard"]
        PipeAPI["/api/pipeline"]
        ChurnAPI["/api/churn-risk"]
        ChatAPI["/api/assistant/chat"]
        PublicAPI["/api/public/*"]
    end
    subgraph ML["AI/ML Engine"]
        VADER["VADER Sentiment"]
        Scorer["Lead Scoring"]
        ChurnCalc["Churn Calculator"]
        MLModel["Gradient Boosting"]
        Gemini["Google Gemini"]
    end
    subgraph DL["Data Layer"]
        MySQL[("MySQL")]
        Redis[("Redis")]
    end
    subgraph BW["Background Workers"]
        CeleryW["Celery Worker"]
        CeleryB["Celery Beat"]
        SMTP["SMTP Email"]
    end
    Browser --> AuthGuard
    Portal --> PublicAPI
    AuthGuard --> Dashboard & Leads & Pipeline & Churn & Assistant & Campaigns
    Dashboard --> DashAPI
    Leads --> LeadAPI
    Pipeline --> PipeAPI
    Churn --> ChurnAPI
    Assistant --> ChatAPI
    AuthAPI & LeadAPI & DashAPI & PipeAPI --> MySQL
    LeadAPI --> VADER & Scorer & ChurnCalc
    ChatAPI --> Gemini
    PublicAPI --> MySQL
    CeleryB --> CeleryW
    CeleryW --> MLModel & ChurnCalc & SMTP
    CeleryW --> MySQL
    Redis --> CeleryW`
      },
      5: {
        title: "Data Flow Sequence Diagram",
        code: `sequenceDiagram
    participant U as User
    participant F as Frontend
    participant B as Backend (Flask)
    participant V as VADER NLP
    participant S as Scoring Engine
    participant C as Churn Calculator
    participant DB as MySQL
    U->>F: Create Lead / Log Interaction
    F->>B: POST /api/leads
    B->>DB: Save record
    B->>V: Analyse sentiment
    V-->>B: Positive / Neutral / Negative
    B->>S: Compute AI score
    S-->>B: Score (0-100)
    B->>C: Evaluate churn risk
    C-->>B: Risk flag + percentage
    B->>DB: Update lead + save history
    B-->>F: Return updated JSON
    F-->>U: Render updated UI`
      },
      6: {
        title: "Background Automation Flow",
        code: `flowchart LR
    subgraph CB["Celery Beat Scheduler"]
        T1["Midnight:\\nrefresh_lead_scores"]
        T2["8 AM:\\nsend_reengagement"]
        T3["Every 6h:\\nrefresh_churn_risk"]
        T4["Every 1h:\\naggregate_sentiment"]
    end
    subgraph CW["Celery Worker"]
        W1["Load ML Model"]
        W2["Query all leads"]
        W3["Predict scores"]
        W4["Find dormant leads"]
        W5["Send SMTP emails"]
        W6["Recalculate churn"]
        W7["Cache in Redis"]
    end
    T1 --> W1 --> W2 --> W3
    T2 --> W4 --> W5
    T3 --> W6
    T4 --> W7`
      },
      7: {
        title: "Use Case Diagram",
        code: `flowchart TD
    subgraph AC["Actors"]
        SR["Sales Rep"]
        SM["Sales Manager"]
        CUST["Customer"]
        SYS["System (Celery)"]
    end
    subgraph UC["Use Cases"]
        UC1["UC1: Register / Login"]
        UC2["UC2: Create Lead"]
        UC3["UC3: View & Edit Lead"]
        UC4["UC4: Log Interaction"]
        UC5["UC5: Move Pipeline"]
        UC6["UC6: View Dashboard"]
        UC7["UC7: View Churn Risk"]
        UC8["UC8: AI Assistant"]
        UC9["UC9: Create Campaign"]
        UC10["UC10: Submit Inquiry"]
        UC11["UC11: CSAT Feedback"]
        UC12["UC12: Auto-Score"]
        UC13["UC13: Auto Re-engage"]
        UC14["UC14: Auto Churn Refresh"]
    end
    SR --> UC1 & UC2 & UC3 & UC4 & UC5 & UC6 & UC7 & UC8 & UC9
    SM --> UC6 & UC7 & UC9
    CUST --> UC10 & UC11
    SYS --> UC12 & UC13 & UC14`
      }
    };

    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get('d')) || 1;
    const diagram = diagrams[id];
    
    if (diagram) {
      document.getElementById('title').textContent = diagram.title;
      document.getElementById('chart').textContent = diagram.code;
    }

    mermaid.initialize({ 
      startOnLoad: true, 
      theme: 'default',
      securityLevel: 'loose',
      flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis' },
      sequence: { useMaxWidth: true }
    });
  </script>
</body>
</html>
